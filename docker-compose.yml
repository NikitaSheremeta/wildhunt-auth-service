version: '3.8'

services:
  app:
    container_name: wildhunt-app
    build:
      context: .
      target: dev
    env_file:
      - .env
    environment:
      - SERVER_PORT=${SERVER_PORT:-5000}
      - NODE_ENV=development
    ports:
      - "${SERVER_PORT:-5000}:5000"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run serve
    restart: unless-stopped